name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # once a day
  workflow_dispatch:       # lets you run it manually from the Actions tab
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # ---------- Card 1: Overview ----------
      - name: Overview card
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34, pinned
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: mabdullahsaqib
          template: classic
          filename: metrics-overview.svg
          config_timezone: Asia/Karachi   # Lahore
          base: header, activity, community, repositories
          base_indepth: yes
          # Smaller repo batches: at 100 the query times out and v3.34 then loads no repos at all
          repositories_batch: 25

          # Full-year 3D contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Lines of code added/removed + history graph
          plugin_lines: yes
          plugin_lines_sections: base, history
          plugin_lines_delay: 30

          # Your open/closed issues and PRs
          plugin_followup: yes
          plugin_followup_sections: user

      # ---------- Card 2: Skills ----------
      - name: Skills card
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34, pinned
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: mabdullahsaqib
          template: classic
          filename: metrics-skills.svg
          config_timezone: Asia/Karachi   # Lahore
          base: ""
          # Smaller repo batches: at 100 the query times out and v3.34 then loads no repos at all
          repositories_batch: 25

          # Languages (includes private repos)
          plugin_languages: yes
          # "recently-used" is left out: GitHub's events API no longer lists push commits,
          # which crashes that section (also unfixed upstream). Achievements and habits are
          # left out for the same reason (GitHub API changes, fixes not released yet)
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: css, cmake
